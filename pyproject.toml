[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmon-report"
version = "0.1.0"
description = "Generate multi-server nmon resource summary reports and PNG charts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
nmon-report = "nmon_report.cli:main"
nmon-report-web = "nmon_report.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
